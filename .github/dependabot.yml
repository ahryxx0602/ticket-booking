version: 2
updates:
  # ----------------------------------------------------------------------------
  # 1. BACKEND MAVEN (Weekly scans, safe updates only)
  # ----------------------------------------------------------------------------
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      backend-safe-updates:
        patterns:
          - "*"
    ignore:
      # Block all Major breaking upgrades
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Anchor Spring Boot to 3.4.x branch (only patch updates, no 3.5+ jumps)
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-minor"]

  # ----------------------------------------------------------------------------
  # 2. FRONTEND NPM (Weekly scans, safe updates only)
  # ----------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      frontend-safe-updates:
        patterns:
          - "*"
    ignore:
      # Block all Major breaking upgrades (Tailwind 4, PrimeVue 5, Vite 8, VueRouter 5)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ----------------------------------------------------------------------------
  # 3. GITHUB ACTIONS (Weekly scans)
  # ----------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      actions-updates:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
