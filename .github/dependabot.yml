version: 2
updates:
  # Maintain dependencies for Maven Backend
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      backend-dependencies:
        patterns:
          - "*"
    ignore:
      # Block all breaking major upgrades (e.g., Spring Boot 3 -> 4, Redisson 3 -> 4)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Maintain dependencies for NPM Frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      # Block all breaking major upgrades (e.g., PrimeVue 4 -> 5, Tailwind 3 -> 4, Vite 6 -> 8)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
