name: Continuous Integration & Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # 1. BACKEND BUILD & VERIFICATION (Java 21 + Spring Boot 3.4.1)
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend Build & Test Suite
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: ticket_booking_db
          MYSQL_USER: ticket_user
          MYSQL_PASSWORD: ticket_password
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Initialize Database Schema
        run: |
          mysql -h 127.0.0.1 -P 3307 -u ticket_user -pticket_password ticket_booking_db < environment/init.sql

      - name: Execute Maven Build, Unit & Real MySQL Concurrency Integration Tests
        working-directory: backend
        run: |
          mvn clean verify -B
          grep -q "Tests run: 6, Failures: 0, Errors: 0, Skipped: 0" ticket-start/target/surefire-reports/com.ticket.concurrency.RealMySqlConcurrencyAndTransactionIT.txt
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3307
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: dev_jwt_secret_key_minimum_32_characters_long
          VNPAY_HASH_SECRET: SANDBOX_HASH_SECRET_VNPAY_2026
          TELEGRAM_ENABLED: false
          MAIL_ENABLED: false
          FIREBASE_ENABLED: false

  # ----------------------------------------------------------------------------
  # 2. FRONTEND BUILD & TEST SUITE (Vue 3 + Vitest + Playwright)
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Build, Unit & E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Type Check Frontend
        working-directory: frontend
        run: npm run type-check

      - name: Audit Design System & Migration Consistency
        working-directory: frontend
        run: node scripts/lint-design-system.js

      - name: Run Vitest Unit & Composable Tests
        working-directory: frontend
        run: npm run test:unit

      - name: Build Production SPA Bundle
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E & Visual Regression Tests
        working-directory: frontend
        run: npm run test:e2e

  # ----------------------------------------------------------------------------
  # 3. SECRET SCANNING & DEPENDENCY SECURITY AUDIT (TruffleHog + OSV-Scanner + NPM Audit)
  # ----------------------------------------------------------------------------
  security-scan:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Dependency Vulnerability Audit (High/Critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Run Verified OSV-Scanner & TruffleHog Security Gate (No Masked Errors)
        run: bash scripts/run-security-scans.sh

  # ----------------------------------------------------------------------------
  # 4. PRODUCTION DOCKER SMOKE TEST & FULL-STACK E2E (CI-002, QA-001, INFRA-002)
  # ----------------------------------------------------------------------------
  production-smoke-ci:
    name: Production Docker Smoke Test & Image Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, security-scan]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Isolated Production Docker Compose Smoke Test
        run: bash scripts/prod-compose-smoke-test.sh
