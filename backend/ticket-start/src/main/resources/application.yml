server:
  port: 8080
  shutdown: graceful

spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
      - optional:file:./environment/.env[.properties]
      - optional:file:../environment/.env[.properties]
      - optional:file:../../environment/.env[.properties]
  application:
    name: velobus-ticketing-platform
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  # SMTP: MailSenderAutoConfiguration chỉ tạo bean JavaMailSender khi có spring.mail.host
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  seed:
    demo-users-enabled: ${APP_SEED_DEMO_USERS_ENABLED:false}
  bootstrap:
    admin:
      enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:local-dev-dummy-secret-key-must-be-at-least-32-chars!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  payment:
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:CGXZLS0Z}
      hash-secret: ${VNPAY_HASH_SECRET:sandbox_vnpay_hash_secret_placeholder}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay-return}
  notification:
    fcm:
      enabled: ${FIREBASE_ENABLED:false}
      credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-dummy.json}
      project-id: ${FIREBASE_PROJECT_ID:vue-http-demo-241ab}
      storage-bucket: ${FIREBASE_STORAGE_BUCKET:vue-http-demo-241ab.firebasestorage.app}
    telegram:
      enabled: ${TELEGRAM_ENABLED:false}
      bot-token: ${TELEGRAM_BOT_TOKEN:mock_bot_token_placeholder}
      bot-username: ${TELEGRAM_BOT_USERNAME:TicketBookingDevBot}
      webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:dev_webhook_secret_key_placeholder}
      admin-chat-id: ${TELEGRAM_ADMIN_CHAT_ID:}
      mode: ${TELEGRAM_BOT_MODE:polling} # "polling" hoặc "webhook"
    mail:
      from: ${MAIL_FROM:noreply@ticketbooking.local}
      enabled: ${MAIL_ENABLED:false}
    qr:
      secret-key: ${QR_SECRET_KEY:default-local-hmac-qr-signing-key-32-chars!}

management:
  health:
    mail:
      enabled: ${MAIL_ENABLED:false}
