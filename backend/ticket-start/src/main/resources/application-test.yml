spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:ticket_booking_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MYSQL_USER:ticket_user}
    password: ${MYSQL_PASSWORD:ticket_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

app:
  seed:
    demo-users-enabled: ${APP_SEED_DEMO_USERS_ENABLED:true}
  notification:
    fcm:
      enabled: false
    telegram:
      enabled: false
    mail:
      enabled: false

management:
  health:
    mail:
      enabled: false
