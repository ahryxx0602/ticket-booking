<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VeloBus — Sàn Đặt Vé Xe Khách Liên Tỉnh & Quản Trị Đội Xe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chống chớp nháy giao diện FOUC & Đồng bộ theme khởi tạo (UI-09) -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('velobus_theme_config_v2');
          var mode = 'system';
          var radius = '1rem';
          var primaryColor = null;
          if (raw) {
            var cfg = JSON.parse(raw);
            if (cfg.mode) mode = cfg.mode;
            if (cfg.radius) radius = cfg.radius;
            if (cfg.primaryColor && /^#[0-9a-fA-F]{3,6}$/.test(cfg.primaryColor)) primaryColor = cfg.primaryColor;
          }
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          if (radius) {
            document.documentElement.style.setProperty('--radius', radius);
          }
          if (primaryColor) {
            document.documentElement.style.setProperty('--primary', primaryColor);
            document.documentElement.style.setProperty('--ring', primaryColor);
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary/20">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
