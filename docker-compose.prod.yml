services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE SERVICE: MySQL 8.4 LTS (Internal Only - No Host Port Publish)
  # ----------------------------------------------------------------------------
  ticket-mysql:
    image: mysql:8.4
    container_name: ticket-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be provided}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ticket_booking_db}
      MYSQL_USER: ${MYSQL_USER:-ticket_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be provided}
    expose:
      - "3306"
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./environment/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ticket-network
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql --protocol=TCP -h 127.0.0.1
          -u "$${MYSQL_USER:-ticket_user}"
          -D "$${MYSQL_DATABASE:-ticket_booking_db}"
          -e "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1024m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 2. CACHE & DISTRIBUTED LOCK: Redis 7.2 (Internal Only with Auth Required)
  # ----------------------------------------------------------------------------
  ticket-redis:
    image: redis:7.2-alpine
    container_name: ticket-redis-prod
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be provided}
    expose:
      - "6379"
    volumes:
      - redis_prod_data:/data
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 512m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 3. BACKEND SERVICE: Spring Boot 3.4.1 (Java 21) - Production Profile
  # ----------------------------------------------------------------------------
  ticket-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-backend-prod
    restart: unless-stopped
    depends_on:
      ticket-mysql:
        condition: service_healthy
      ticket-redis:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      # Bind to localhost loopback only for local admin debug; never 0.0.0.0
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=ticket-mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-ticket_booking_db}
      - MYSQL_USER=${MYSQL_USER:-ticket_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD must be provided}
      - REDIS_HOST=ticket-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be provided}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be provided}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET:?VNPAY_HASH_SECRET must be provided}
      - QR_SECRET_KEY=${QR_SECRET_KEY:?QR_SECRET_KEY must be provided}
      - APP_SEED_DEMO_USERS_ENABLED=false
      - APP_BOOTSTRAP_ADMIN_ENABLED=${APP_BOOTSTRAP_ADMIN_ENABLED:-false}
      - APP_BOOTSTRAP_ADMIN_USERNAME=${APP_BOOTSTRAP_ADMIN_USERNAME:-}
      - APP_BOOTSTRAP_ADMIN_EMAIL=${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      - APP_BOOTSTRAP_ADMIN_PASSWORD=${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-}
      - MAIL_ENABLED=${MAIL_ENABLED:-false}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - FIREBASE_ENABLED=${FIREBASE_ENABLED:-false}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_CREDENTIALS_PATH=/app/firebase-service-account.json
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET:-}
    volumes:
      - ./environment/firebase-service-account.json:/app/firebase-service-account.json:ro
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/internal/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1024m
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 4. FRONTEND GATEWAY: Vue 3 + Tailwind + PrimeVue 4 + Nginx Alpine
  # ----------------------------------------------------------------------------
  ticket-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticket-frontend-prod
    restart: unless-stopped
    depends_on:
      ticket-backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ticket-network:
    driver: bridge

volumes:
  mysql_prod_data:
  redis_prod_data:
